name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let an in-flight one finish rather than cancelling.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The version on the home screen counts commits, and the default
          # shallow fetch would hand the build a count of one.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      # Unset secrets arrive as empty strings, which the build reads as
      # "no relay" and ships a STUN-only bundle — the same thing it shipped
      # before TURN was configurable at all.
      - run: npm run build
        env:
          VITE_TURN_URLS: ${{ secrets.TURN_URLS }}
          VITE_TURN_USERNAME: ${{ secrets.TURN_USERNAME }}
          VITE_TURN_CREDENTIAL: ${{ secrets.TURN_CREDENTIAL }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
